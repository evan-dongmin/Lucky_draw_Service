# Render.com 블루프린트. 대시보드에서 "New +" -> "Blueprint" -> 이 저장소
# 선택만 하면 아래 설정이 자동 반영된다(Dockerfile 기반, 웹소켓 지원).
# 무료 플랜은 트래픽이 없으면 슬립되므로, 행사 당일에는 시작 10~15분 전에
# 한 번 접속해 깨워두는 것을 권장한다.
services:
  - type: web
    name: taachuwi-grandprix
    runtime: docker
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      # XAI_API_KEY / GEMINI_API_KEY는 대시보드 Environment 탭에서 직접
      # 설정한다(선택 사항 -- 없어도 MC 정적 폴백 멘트로 전 기능이 동작한다).
      # Grok을 우선 호출하고 실패/한도 초과 시 Gemini로 자동 대체한다.
      # 절대 이 파일(render.yaml)에는 실제 키 값을 직접 넣지 않는다 -- 이
      # 파일은 저장소에 커밋되므로 대시보드에서만 값을 입력해야 한다.
    healthCheckPath: /
