<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>타추위 추첨 - 예측 게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/mobile.css" />
</head>
<body>
  <main id="mobile-root">
    <h1>🎯 예측 게임</h1>

    <section id="onboarding-view" class="panel">
      <div id="onboarding-step-department">
        <h2>1. 부서를 선택하세요</h2>
        <div id="department-list" class="choice-list"></div>
      </div>
      <div id="onboarding-step-name" class="hidden">
        <h2>2. 본인 이름을 선택하세요</h2>
        <div id="name-list" class="choice-list"></div>
        <button id="btn-back-to-department">← 부서 다시 선택</button>
      </div>
      <div id="onboarding-step-character" class="hidden">
        <h2>3. 내 카트의 특수능력을 선택하세요</h2>
        <p class="hint-line">고르지 않아도 소속 부서 기준으로 자동 배정됩니다. 언제든 바꿀 수 있어요.</p>
        <div id="character-list" class="choice-list character-list"></div>
        <button id="btn-skip-character">나중에 고를게요</button>
      </div>
      <p id="onboarding-error" class="error"></p>
    </section>

    <section id="game-view" class="hidden">
      <p id="my-name" class="my-name"></p>
      <p id="my-character-line" class="my-character">
        <span id="my-character-display"></span>
        <button id="btn-change-character">카트 변경</button>
      </p>
      <p id="my-score" class="my-score"></p>

      <div id="cheer-panel" class="panel cheer-panel">
        <h2>응원 보내기</h2>
        <div id="cheer-buttons" class="cheer-buttons"></div>
      </div>

      <div id="cards"></div>
      <p id="predictions-off-note" class="hint-line hidden">
        이번 세션은 예측 게임이 없습니다 -- 카트만 골라주시면 됩니다!
      </p>

      <div id="leaderboard-panel" class="panel">
        <h2 id="leaderboard-title">리더보드</h2>
        <ol id="leaderboard-list"></ol>
      </div>
    </section>

    <div id="character-overlay" class="character-overlay hidden">
      <div class="character-overlay-inner">
        <h2>카트 변경</h2>
        <div id="character-overlay-list" class="choice-list character-list"></div>
        <button id="btn-close-character-overlay">닫기</button>
      </div>
    </div>
  </main>
  <script src="/static/shared.js"></script>
  <script src="/static/mobile.js"></script>
</body>
</html>
