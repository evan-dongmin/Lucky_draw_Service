<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>타추위 추첨 - 운영 콘솔</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <main id="admin-root">
    <h1>운영 콘솔</h1>
    <p id="ws-status" class="status">연결 대기 중...</p>

    <section id="section-roster" class="panel">
      <h2>1. 참가자 명단</h2>
      <div class="row">
        <textarea id="roster-text" rows="6" placeholder="사번,이름,팀
P001,홍길동,개발팀
P002,김철수,영업팀"></textarea>
      </div>
      <div class="row">
        <button id="btn-preview-text">붙여넣은 텍스트 미리보기</button>
        <input type="file" id="roster-file" accept=".csv,.xlsx" />
        <button id="btn-upload-file">파일 업로드 미리보기</button>
        <button id="btn-sample">샘플 250명 생성</button>
        <button id="btn-mc-pregenerate">MC 멘트 사전생성</button>
        <span id="mc-status" class="status"></span>
      </div>
      <div id="roster-warnings" class="warnings"></div>
      <div id="roster-preview" class="preview"></div>
    </section>

    <section id="section-session" class="panel">
      <h2>2. 세션 생성</h2>
      <div class="row">
        <label>당첨 인원수 <input type="number" id="draw-count" value="3" min="1" /></label>
        <label>모드
          <select id="mode-select">
            <option value="roulette">룰렛 (안전망 MVP)</option>
            <option value="racing">레이싱 (부서 대항 퍼널)</option>
          </select>
        </label>
        <label>총 진행 시간(초) <input type="number" id="total-seconds" value="300" min="150" /></label>
        <label><input type="checkbox" id="predictions-enabled" /> 참여형 예측 게임 활성화 (레이싱 모드 전용)</label>
        <button id="btn-create-session">세션 생성</button>
      </div>
    </section>

    <section id="section-run" class="panel">
      <h2>3. 진행</h2>
      <div id="session-info" class="info">세션 없음</div>

      <div class="row">
        <label>제외할 참가자 ID (쉼표/줄바꿈 구분)</label>
      </div>
      <div class="row">
        <textarea id="exclude-ids" rows="2"></textarea>
        <button id="btn-apply-exclude">제외 적용</button>
      </div>

      <div class="row">
        <button id="btn-commit">① 커밋 생성</button>
        <button id="btn-reveal">② 추첨 시작(리빌) - 룰렛 모드</button>
        <button id="btn-start-racing">② 레이스 시작 - 레이싱 모드</button>
        <button id="btn-bots-fill">예측 봇으로 채우기 (데모 전용)</button>
      </div>
      <div id="commit-display" class="commit-box"></div>
      <div id="racing-status" class="commit-box"></div>

      <div class="row">
        <label>무대 카메라</label>
        <button class="camera-btn" data-mode="auto">자동(라운드별)</button>
        <button class="camera-btn" data-mode="wide">광각</button>
        <button class="camera-btn" data-mode="medium">중간 줌</button>
        <button class="camera-btn" data-mode="close">클로즈업</button>
        <button id="btn-fast-forward">⏩ 이 라운드 조기 종료(비상)</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="redraw-exclude-winners" checked /> 이전 당첨자 제외하고 재추첨</label>
        <button id="btn-redraw">재추첨</button>
        <button id="btn-reset" class="danger">전체 초기화</button>
      </div>

      <div id="draws-history"></div>

      <p><a href="/verify" target="_blank">공정성 검증 페이지 열기 →</a> · <a href="/" target="_blank">무대 화면 열기 →</a> · <a href="/mobile" target="_blank">참여(모바일) 화면 열기 →</a></p>
    </section>
  </main>
  <script src="/static/shared.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
